<h1>VoiceCommand プライバシーポリシー</h1>
<p>VoiceCommand は作者が自分専用に使う個人用ツールです。</p>
<p>Google カレンダーへのアクセスは、作者本人が指示した予定を、作者本人のカレンダーに追加するためだけに使います。</p>
<p>取得した情報は作者の自宅 PC の中にだけ保存し、第三者に提供・共有・販売することはありません。</p>
<p>Google API から受け取った情報の利用は、Google API Services User Data Policy（Limited Use の要件を含む）に従います。</p>
